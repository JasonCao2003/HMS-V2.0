server:
  port: ${SERVER_PORT:8080}


# 启动项目自动打开浏览器
openProject:
  isOpen: true
  cmd: cmd   /c   start
  web:
    openUrl: http://localhost:${server.port}


# 指定文件上传的路径（可通过环境变量 PHOTO_FILE_DIR 覆盖）
photo:
  file:
    dir: ${PHOTO_FILE_DIR:D:/Code/HMS/photo}


spring:
  application:
    name: HMS

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html

  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${MYSQL_URL:jdbc:mysql://localhost:3306/hms?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/, file:${photo.file.dir}
  # 邮箱验证 -- 未实现
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          ssl:
            enable = true
    default-encoding: UTF-8

  # Redis缓存
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-active: 32
        max-wait: 300ms
        max-idle: 16
        min-idle: 8








mybatis-plus:
  configuration:
    # 驼峰命名法
    map-underscore-to-camel-case: true
    # SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID




alipay:
  url: ${ALIPAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  appid: ${ALIPAY_APPID:}
  privateKey: ${ALIPAY_PRIVATE_KEY:}
  publicKey: ${ALIPAY_PUBLIC_KEY:}
  notifyUrl: ${ALIPAY_NOTIFY_URL:http://localhost:8080/notify}
  returnUrl: ${ALIPAY_RETURN_URL:http://localhost:8080/return}
