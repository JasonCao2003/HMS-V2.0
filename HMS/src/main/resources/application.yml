server:
  port: 8080


# 启动项目自动打开浏览器
openProject:
  isOpen: true
  cmd: cmd   /c   start
  web:
    openUrl: http://localhost:${server.port}


# 指定文件上传的路径
photo:
  file:
    dir: D:\Code\HMS\photo


spring:
  application:
    name: HMS

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html

  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/hms?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/, file:${photo.file.dir}
  # 邮箱验证 -- 未实现
