<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/64d58efce2.js"></script>
    <link href="/css/login.css" rel="stylesheet" type="text/css"/>
    <link href="/front/layui/css/layui.css" rel="stylesheet" type="text/css">
    <title>注册表单</title>
</head>


<body>
<!--翻译-->
<div style="position: relative ;right: 30px">
    <div style="width: 210px;position: relative;float: right;">
        <div class="ignore">
            <a href="javascript:translate.changeLanguage('english');">English</a>|
            <a href="javascript:translate.changeLanguage('chinese_simplified');">简体中文</a>|
            <a href="javascript:translate.changeLanguage('chinese_traditional');">繁體中文</a>
        </div>
    </div>
</div>
<div class="container">
    <div class="forms-container">
        <div class="signin-signup">
            <form class="sign-in-form" method="post" th:action="@{userRegister}">
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input id="username" name="username" placeholder="用户名" type="text"/>
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input id="password" name="password" placeholder="密码" type="password" oninput="checkPassword()"/>
                    <span id="passwordError"
                          style="color: red; position: absolute; left: 400px;width: 200px;top: 16px"></span>
                </div>
                <div class="input-field">
                    <i class="fa fa-address-card"></i>
                    <input id="realname" name="realname" placeholder="姓名" type="text"/>
                </div>
                <div class="input-field">
                    <i class="fa fa-intersex"></i>
                    <select id="sex" name="sex">
                        <option value="保密"></option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="input-field">
                    <i class="fa fa-calendar-minus-o"></i>
                    <!--                    <input type="date" id="datepicker" name="birthday" th:placeholder="生日"/>-->
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" id="ID-laydate-demo" name="birthday" placeholder="生日">
                    </div>
                </div>
                <div class="input-field">
                    <i class="fa fa-bell"></i>
                    <input id="contact" name="contact" placeholder="联系方式" type="text" oninput="checkContact()"/>
                    <span id="contactError"
                          style="color: red; position: absolute; left: 400px;width: 200px;top: 16px"></span>
                </div>
                <div class="input-field">
                    <i class="fa fa-minus-circle"></i>
                    <input id="code" name="code" placeholder="验证码（请注意大小写）" type="text"/>
                </div>
                <div>
                    <img id="num" class="input-field" onclick="changeImageCode()" th:src="@{generateImageCode}">
                    <script>
                        function changeImageCode() {
                            document.getElementById('num').src = '[[@{generateImageCode}]]?' + (new Date()).getTime()
                        }
                    </script>
                </div>
                <input class="btn solid" type="submit" value="注册"/>
            </form>
        </div>
    </div>

    <div class="panels-container">
        <div class="panel left-panel">
            <div class="content">
                <h3>已有账号？</h3>
                <p>
                    如果已经有账号，点击下方按钮直接登录。
                </p>
                <a href="/login">
                    <button class="btn transparent">登录</button>
                </a>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
    function checkPassword() {
        var passwordInput = document.getElementById('password');
        var passwordError = document.getElementById('passwordError');

        if (!/^.{6,}$/.test(passwordInput.value)) {
            passwordError.textContent = "密码至少包含6个字符";
        } else {
            passwordError.textContent = "";
        }
    }

    function checkContact() {
        var contactInput = document.getElementById('contact');
        var contactError = document.getElementById('contactError');
        if (!/^.{11}$/.test(contactInput.value)) {
            contactError.textContent = "不是正确的电话号码";
        } else {
            contactError.textContent = "";
        }
    }

</script>

<script th:inline="javascript">
    var isRegister = [[${isRegister}]];
    if (isRegister === true) {
        alert('注册成功！');
    } else if (isRegister === false) {
        alert('注册失败！请重试！');
    }
</script>
<script src="/front/layui/layui.js"></script>
<script>
    layui.use(function () {
        var laydate = layui.laydate;
        // 渲染
        laydate.render({
            elem: '#ID-laydate-demo'
        });
    });
</script>
<script src="https://cdn.staticfile.net/translate.js/3.2.1/translate.js"></script>
<script>
    translate.language.setLocal('chinese_simplified');
    translate.service.use('client.edge');
    translate.execute();//进行翻译
</script>
</body>
</html>
