<div class="card-body">
    <H2>我的反馈</H2>
    <div class="table-responsive">
        <table class="table table-bcomplained">
            <thead>
            <tr>
                <th style="width: 10%">标题</th>
                <th style="width: 10%">内容</th>
                <th style="width: 10%">状态</th>
                <th style="width: 10%">添加时间</th>
                <th style="width: 10%">管理员回复</th>
                <th style="width: 10%">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="complain:${complains}">
                <td th:text="${complain.title}"></td>
                <td th:text="${complain.contents}"></td>
                <td th:text="${complain.status}"></td>
                <td th:text="${#dates.format(complain.addtime,'yyyy-MM-dd')}"></td>
                <td th:text="${complain.reps}">
                <td>
                    <div class="btn-group">
                        <a class="btn btn-xs btn-default" data-toggle="tooltip"
                           href="javascript:"
                           th:onclick="'IsDetermine1('+${complain.complainsid}+')'"
                           title="删除"><i class="mdi mdi-window-close"></i>
                        </a>
                    </div>
                </td>
            </tr>
            <script>
                function IsDetermine1(id) {
                    if (window.confirm('确定要删除吗？')) {
                        location.href = '/cancelComplains?id=' + id;
                    }
                }
            </script>
            </tbody>
        </table>
    </div>
</div>
