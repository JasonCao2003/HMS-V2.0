<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport"/>
    <title>首页</title>
    <link href="/img/favicon.ico" rel="icon" type="image/ico">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
    <!--时间选择插件-->
    <link href="/js/bootstrap-datetimepicker/bootstrap-datetimepicker.min.css" rel="stylesheet">
    <!--日期选择插件-->
    <link href="/js/bootstrap-datepicker/bootstrap-datepicker3.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body>
<div class="lyear-layout-web">
    <div class="lyear-layout-container">
        <!--左侧导航-->
        <aside class="lyear-layout-sidebar">
            <!-- logo -->
            <div class="sidebar-header" id="logo">
                <a th:href="@{charset}"><img alt="LightYear" src="/img/logo-sidebar.png" title="LightYear"/></a>
            </div>
            <div class="lyear-layout-sidebar-scroll">
                <nav class="sidebar-main">
                    <ul class="nav nav-drawer">
                        <li class="nav-item"><a th:href="@{charset}"><i class="mdi mdi-home"></i> 后台首页</a></li>
                        <!-- 下面li标签设置为class="active open"则会展开-->
                        <li class="nav-item nav-item-has-subnav">
                            <a href="javascript:void(0)"><i class="mdi mdi-palette"></i>账号管理</a>
                            <ul class="nav nav-subnav">
                                <!-- 下面li标签设置为class="active"则会选中-->
                                <li><a th:href="@{listAdmins}">管理员管理</a></li>
                                <li><a th:href="@{listEmploys}">员工管理</a></li>
                                <li><a th:href="@{listUsers}">用户管理</a></li>
                            </ul>
                        </li>
                        <li class="nav-item nav-item-has-subnav">
                            <a href="javascript:void(0)"><i class="mdi mdi-format-align-justify"></i>信息管理</a>
                            <ul class="nav nav-subnav">
                                <li><a th:href="@{listArticles}">新闻公告管理</a></li>
                                <li><a th:href="@{listComplains}">意见反馈管理</a></li>
                                <li><a th:href="@{listTopics}">用餐评价管理</a></li>
                            </ul>
                        </li>
                        <li class="nav-item nav-item-has-subnav open active">
                            <a href="javascript:void(0)"><i class="mdi mdi-file-outline"></i>后勤管理</a>
                            <ul class="nav nav-subnav">
                                <li class="active"><a th:href="@{listRooms}">客房管理</a></li>
                                <li><a th:href="@{listTabx}">餐桌管理</a></li>
                                <li><a th:href="@{listFoods}">食品管理</a></li>
                                <li><a th:href="@{listBuy}">采购管理</a></li>
                            </ul>
                        </li>
                        <li class="nav-item nav-item-has-subnav">
                            <a href="javascript:void(0)"><i class="mdi mdi-language-javascript"></i>财务管理</a>
                            <ul class="nav nav-subnav">
                                <li><a th:href="@{listBookings}">收支管理</a></li>
                                <li><a th:href="@{listOrders}">食品订单</a></li>
                                <li><a th:href="@{listRoomorders}">客房订单</a></li>
                                <li><a th:href="@{listHist}">消费记录</a></li>

                            </ul>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <p class="copyright">Copyright &copy; 2023 </p>
                </div>
            </div>
        </aside>
        <!--End 左侧导航-->

        <!--头部信息-->
        <header class="lyear-layout-header">
            <nav class="navbar navbar-default">
                <div class="topbar">

                    <div class="topbar-left">
                        <div class="lyear-aside-toggler">
                            <span class="lyear-toggler-bar"></span>
                            <span class="lyear-toggler-bar"></span>
                            <span class="lyear-toggler-bar"></span>
                        </div>
                        <span class="navbar-page-title"> 修改房间信息 </span>
                    </div>
                    <ul class="topbar-right">
                        <li class="dropdown dropdown-profile">
                            <a data-toggle="dropdown" href="javascript:void(0)">
                                <img alt="笔下光年" class="img-avatar img-avatar-48 m-r-10" src="/img/avatar.jpg"/>
                                欢迎：<span th:text="${session.admin.username}">请登录<span class="caret"></span></span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-right">
                                <li><a th:href="@{listInformation}"><i class="mdi mdi-account"></i> 个人信息</a></li>
                                <li><a th:href="@{/Logout}"><i class="mdi mdi-logout-variant"></i> 退出登录</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>
        <!--End 头部信息-->

        <!--页面主要内容-->
        <main class="lyear-layout-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <form class="row" enctype="multipart/form-data" method="post"
                                      th:action="@{/modifyRooms}">
                                    <div class="form-group col-md-12">
                                        <input class="form-control" id="roomsid" name="roomsid"
                                               th:value="${rooms.roomsid}" type="hidden"/>
                                        <span id="roomsnoError" style="color: red;"></span>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="roomsno">客房编号</label>
                                        <input class="form-control" id="roomsno" name="roomsno"
                                               placeholder="请输入客房编号"
                                               th:value="${rooms.roomsno}" type="text" value=""
                                               oninput="checkRoomsno()"/>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="cate">客房类型</label>
                                        <input class="form-control" id="cate" name="cate" placeholder="客房类型"
                                               th:value="${rooms.cate}" type="text" value=""/>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="photo">图片</label>
                                        <input class="form-control" id="photo" name="photo" th:value="${rooms.image}"
                                               title="点击上传" type="file">
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="price">价格</label>
                                        <input class="form-control" id="price" name="price" pattern="\d+(\.\d{1,2})?"
                                               placeholder="价格" required th:value="${rooms.price}"
                                               title="采购单价必须是数字，最多包含两位小数"
                                               type="text" value="" oninput="checkPrice()"/>
                                        <span id="priceError" style="color: red;"></span>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="mianji">客房面积</label>
                                        <input class="form-control" id="mianji" name="mianji" placeholder="客房面积"
                                               th:value="${rooms.mianji}" type="text" value="" oninput="checkMianji()"/>
                                        <span id="mianjiError" style="color: red;"></span>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="chaoxiang">客房朝向</label>
                                        <div class="form-controls">
                                            <select class="form-control" id="chaoxiang" name="chaoxiang">
                                                <option th:value="${rooms.chaoxiang}"
                                                        th:text="${rooms.chaoxiang}"></option>
                                                <option value="东向">东向</option>
                                                <option value="西向">西向</option>
                                                <option value="南向">南向</option>
                                                <option value="北向">北向</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="status">客房状态</label>
                                        <div class="form-controls">
                                            <select class="form-control" id="status" name="status">
                                                <option th:value="${rooms.status}" th:text="${rooms.status}"></option>
                                                <option value="可预订">可预订</option>
                                                <option value="不可预订">不可预订</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="hits">点击数</label>
                                        <input class="form-control" id="hits" name="hits" placeholder="点击数"
                                               th:value="${rooms.hits}" type="text" value="" oninput="checkHits()"/>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <label for="contents">客房介绍</label>
                                        <textarea class="form-control" id="contents" name="contents"
                                                  placeholder="客房介绍" th:text="${rooms.contents}"></textarea>
                                    </div>
                                    <div class="form-group col-md-12">
                                        <button class="btn btn-primary ajax-post" type="submit">确 定</button>
                                        <a class="btn btn-default" th:href="@{listRooms}" type="button">返 回</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </main>
        <!--End 页面主要内容-->
    </div>
</div>

<script th:inline="javascript">
    function checkRoomsno() {
        var roomsnoInput = document.getElementById('roomsno');
        var roomsnoError = document.getElementById('roomsnoError');

        if (!/^[0-9]+$/.test(roomsnoInput.value)) {
            roomsnoError.textContent = "只允许添加数字";
        } else {
            roomsnoError.textContent = "";
        }
    }

    function checkPrice() {
        var priceInput = document.getElementById('price');
        var priceError = document.getElementById('priceError');

        if (!/^(?:[1-9][0-9]{0,2}|1000)$/.test(priceInput.value)) {
            priceError.textContent = "价格只能是0到1000之间的数字";
        } else {
            priceError.textContent = "";
        }
    }

    function checkMianji() {
        var mianjiInput = document.getElementById('mianji');
        var mianjiError = document.getElementById('mianjiError');

        if (!/^\d+\s*平米$/.test(mianjiInput.value)) {
            mianjiError.textContent = "请输入正确的面积格式，例如：30 平米";
        } else {
            mianjiError.textContent = "";
        }
    }

    function checkHits() {
        var hitsInput = document.getElementById('hits');
        var hitsError = document.getElementById('hitsError');


        if (!/^(?:[0-9])$/.test(hitsInput.value)) {
            hitsError.textContent = "点击量只能是数字";
        } else {
            hitsError.textContent = "";
        }
    }
</script>

<script src="/js/jquery.min.js" type="text/javascript"></script>
<script src="/js/bootstrap.min.js" type="text/javascript"></script>
<script src="/js/perfect-scrollbar.min.js" type="text/javascript"></script>
<script src="/js/main.min.js" type="text/javascript"></script>
<!--时间选择插件-->
<script src="/js/bootstrap-datetimepicker/moment.min.js"></script>
<script src="/js/bootstrap-datetimepicker/bootstrap-datetimepicker.min.js"></script>
<script src="/js/bootstrap-datetimepicker/locale/zh-cn.js"></script>
<!--日期选择插件-->
<script src="/js/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
<script src="/js/bootstrap-datepicker/locales/bootstrap-datepicker.zh-CN.min.js"></script>
<script src="/js/main.min.js" type="text/javascript"></script>
<script th:inline="javascript">
    var isAdd = [[${isModify}]];
    if (isAdd === true) {
        alert('修改成功！');
        window.location.href = '/listRooms';
    } else if (isAdd === false) {
        alert('修改失败！');
    }
</script>
</body>
</html>
