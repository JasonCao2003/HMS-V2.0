<!DOCTYPE html>

<body>

                            <ul class="nav nav-subnav">

                            </ul>
                        </li>
                        <li class="nav-item nav-item-has-subnav">
                            <a href="javascript:void(0)"><i class="mdi mdi-file-outline"></i>后勤管理</a>
                            <ul class="nav nav-subnav">
                                <li><a th:href="@{listRooms}">客房管理</a></li>
                                <li><a th:href="@{listTabx}">餐桌管理</a></li>
                                <li><a th:href="@{listFoods}">食品管理</a></li>
                                <li><a th:href="@{listBuy}">采购管理</a></li>
                            </ul>
                        </li>
                        <li class="nav-item nav-item-has-subnav">
                            <a href="javascript:void(0)"><i class="mdi mdi-language-javascript"></i>财务管理</a>
                            <ul class="nav nav-subnav">
                                <li><a th:href="@{listBookings}">收支管理</a></li>
                                <li><a th:href="@{listOrders}">食品订单</a></li>
                                <li><a th:href="@{listRoomorders}">客房订单</a></li>
                                <li><a th:href="@{listHist}">消费记录</a></li>

                            </ul>

                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <p class="copyright">Copyright &copy; 2023 </p>

        <!--End 左侧导航-->

        <!--头部信息-->
        <header class="lyear-layout-header">
            <nav class="navbar navbar-default">
                <div class="topbar">

                    <div class="topbar-left">
                        <div class="lyear-aside-toggler">
                            <span class="lyear-toggler-bar"></span>
                            <span class="lyear-toggler-bar"></span>
                            <span class="lyear-toggler-bar"></span>
                        </div>
                        <span class="navbar-page-title"> 后台首页 </span>
                    </div>
                    <ul class="topbar-right">
                        <li class="dropdown dropdown-profile">
                            <a data-toggle="dropdown" href="javascript:void(0)">
                                <img alt="笔下光年" class="img-avatar img-avatar-48 m-r-10" src="/img/avatar.jpg"/>

                            </a>

                                <li><a th:href="@{listInformation}"><i class="mdi mdi-account"></i> 个人信息</a></li>

            </nav>
        </header>
        <!--End 头部信息-->

        <!--页面主要内容-->
        <main class="lyear-layout-content">
            <div class="container-fluid">
                <div class="row">

                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header"><h4>预计未来一周销售额</h4></div>
                            <div class="card-body">
                                <canvas height="250" id="chart-line-2" width="400"></canvas>
                            </div>
                        </div>
                    </div>


                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header"><h4>每日收入</h4></div>
                            <div class="card-body">
                                <canvas height="250" id="chart-line-1" width="400"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header"><h4>单笔营收额</h4></div>
                            <div class="card-body">
                                <canvas height="250" id="chart-vbar-1" width="400"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header"><h4>各类客房当月销售量</h4></div>
                            <div class="card-body">
                                <canvas height="390" id="chart-pie" width="600"></canvas>
                            </div>
                        </div>
                    </div>

                    <!--                  <div class="col-lg-6">
                                        <div class="card">
                                          <div class="card-header"><h4>雷达图</h4></div>
                                          <div class="card-body">
                                            <canvas id="chart-radar" width="360" height="360"></canvas>
                                          </div>
                                        </div>
                                      </div>-->
                </div>
            </div>
        </main>
        <!--End 页面主要内容-->
    </div>
</div>

<script src="/js/jquery.min.js" type="text/javascript"></script>
<script src="/js/bootstrap.min.js" type="text/javascript"></script>
<script src="/js/perfect-scrollbar.min.js" type="text/javascript"></script>
<script src="/js/Chart.js" type="text/javascript"></script>
<script src="/js/main.min.js" type="text/javascript"></script>


<!--单笔营收额-->
<script th:inline="javascript">
    var addtimeList = [[${addtime}]];
    // 格式化日期列表
    var formattedDates = addtimeList.map(function (dateString) {
        return formatDate(dateString);
    });

    new Chart($("#chart-vbar-1"), {
        type: 'bar',
        data: {
            labels: formattedDates,
            datasets: [{
                label: "单笔营收额",
                backgroundColor: "rgba(51,202,185,0.5)",
                borderColor: "rgba(0,0,0,0)",
                hoverBackgroundColor: "rgba(51,202,185,0.7)",
                hoverBorderColor: "rgba(0,0,0,0)",
                data: [[${chartData}]]
            }]
        },
        options: {
            scales: {
                yAxes: [{
                    ticks: {
                        beginAtZero: true
                    }
                }]
            }
        }
    });

    function formatDate(dateString) {
        var date = new Date(dateString);
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }
</script>


<!--各类客房当月销售量-->
<script th:inline="javascript">

    new Chart($("#chart-pie"), {
        type: 'pie',
        data: {
            labels: [[${cate}]],
            datasets: [{
                data: [[${hits}]],
                backgroundColor: ['rgba(255,99,132,1)', 'rgba(54, 162, 235, 1)', 'rgba(255, 206, 86, 1)', 'rgb(7,255,0)', 'rgb(170,0,255)']
            }]
        },
        options: {
            responsive: false
        }
    });
</script>

<!--预计未来一周收入-->
<script th:inline="javascript">
    var addtimeList = [[${forecastdate}]];

    // 格式化日期列表
    var formattedDates = addtimeList.map(function (dateString) {
        return formatDate(dateString);
    });

    new Chart($("#chart-line-2"), {
        type: 'line',
        data: {
            labels: formattedDates,
            datasets: [
                {
                    label: "收入",
                    fill: false,
                    borderColor: "rgba(255, 0, 0, 1)",
                    borderWidth: 3,
                    pointRadius: 0,
                    data: [[${forecast}]]
                }
            ]
        },
        options: {
            legend: {
                display: false
            },
        }
    });

    function formatDate(dateString) {
        var date = new Date(dateString);
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }
</script>


<!--每日收入-->
<script th:inline="javascript">
    var addtimeList = [[${addtime}]];

    // 格式化日期列表
    var formattedDates = addtimeList.map(function (dateString) {
        return formatDate(dateString);
    });

    new Chart($("#chart-line-1"), {
        type: 'line',
        data: {
            labels: formattedDates,
            datasets: [
                {
                    label: "收入",
                    fill: false,
                    borderColor: "rgba(255, 0, 0, 1)",
                    borderWidth: 3,
                    pointRadius: 0,
                    data: [[${chartData}]]
                }
            ]
        },
        options: {
            legend: {
                display: false
            },
        }
    });

    function formatDate(dateString) {
        var date = new Date(dateString);
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }
</script>


<script th:inline="javascript">
    var tabxCate = [[${tabxCate}]];
    var num = [[${num}]];
    var colors = [
        "rgba(255, 99, 132, 0.7)",
        "rgba(255, 205, 86, 0.7)",
        "rgba(54, 162, 235, 0.7)",
        "rgba(255, 159, 64, 0.7)",
        "rgba(75, 192, 192, 0.7)",
        "rgba(153, 102, 255, 0.7)",
        "rgba(201, 203, 207, 0.7)"
    ];
    new Chart($("#chart-radar"), {
        type: 'radar',
        data: {
            labels: [[${place}]],
            datasets: tabxCate.map(function (cate, index) {
                return {
                    label: cate,
                    backgroundColor: colors[index],
                    borderColor: "rgba(0,0,0,0)",
                    pointBackgroundColor: colors[index],
                    pointBorderColor: "#fff",
                    pointHoverBackgroundColor: "#fff",
                    pointHoverBorderColor: colors[index],
                    data: [num[index]] // 使用 item.num 替代 item.data
                };
            })
        },
        options: {
            responsive: false,
            legend: {
                display: false
            }
        }
    });
</script>

</body>
</html>
